<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사계절 텃밭 - 3분 하루 & 15분 절기 타이머</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background-color: #1b262c; font-family: 'Malgun Gothic', sans-serif; }
    #game-container { width: 100vw; height: 100vh; }
    
    /* 상단 안내 & 시간 UI */
    #ui-panel {
      position: absolute; top: 15px; left: 15px; z-index: 10; color: #fff;
      background: rgba(0, 0, 0, 0.65); padding: 14px 20px; border-radius: 14px;
      backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); font-size: 13px; pointer-events: none;
    }
    #season-text { font-size: 16px; font-weight: bold; color: #2ecc71; margin-bottom: 4px; }
    #weather-text { color: #74b9ff; margin-bottom: 6px; }

    /* 씨앗 선택 바 */
    #seed-selector {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
      display: flex; gap: 8px; background: rgba(0, 0, 0, 0.65); padding: 8px 14px;
      border-radius: 30px; backdrop-filter: blur(6px);
    }
    .seed-btn {
      padding: 8px 14px; font-size: 13px; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px; background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; transition: 0.2s;
    }
    .seed-btn.active { background: #2ecc71; border-color: #2ecc71; font-weight: bold; }

    /* 인벤토리 UI */
    #inventory-panel {
      position: absolute; top: 15px; right: 15px; z-index: 10; color: #fff;
      background: rgba(0, 0, 0, 0.65); padding: 12px 18px; border-radius: 12px;
      backdrop-filter: blur(6px); font-size: 13px; min-width: 140px;
    }
    #inventory-panel h4 { margin: 0 0 8px 0; font-size: 14px; color: #f1c40f; border-bottom: 1px solid #555; padding-bottom: 4px; }
    .inv-item { margin-bottom: 4px; cursor: pointer; }
    .inv-item:hover { color: #2ecc71; }

    /* 수확 시 재심기 팝업 */
    #replant-modal {
      display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 100; background: rgba(20, 20, 20, 0.95); color: #fff; padding: 24px;
      border-radius: 16px; border: 1px solid rgba(255,255,255,0.2); text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8); min-width: 260px;
    }
    #modal-msg { font-size: 16px; margin-bottom: 20px; font-weight: bold; }
    .modal-btn-group { display: flex; justify-content: center; gap: 16px; }
    .modal-btn { padding: 8px 24px; font-size: 14px; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
    #btn-yes { background: #2ecc71; color: #fff; }
    #btn-no { background: #e74c3c; color: #fff; }
  </style>
</head>
<body>
  <div id="ui-panel">
    <div id="season-text">🌸 현재 절기: 봄 (00:00)</div>
    <div id="weather-text">서울 실시간 날씨 로딩 중...</div>
    <div>⌨️ <b>조작:</b> 방향키(이동) | 밭 클릭(씨 뿌리기 ➔ 물주기 ➔ 수확)</div>
  </div>

  <div id="inventory-panel">
    <h4>🎒 보관함 (씨앗)</h4>
    <div id="inv-list">씨앗 없음</div>
  </div>

  <div id="seed-selector">
    <button class="seed-btn active" data-crop="lettuce">🥬 봄: 상추</button>
    <button class="seed-btn" data-crop="corn">🌽 여름: 옥수수</button>
    <button class="seed-btn" data-crop="sweetpotato">🍠 가을: 고구마</button>
    <button class="seed-btn" data-crop="napa">🥬 겨울: 배추</button>
  </div>

  <div id="replant-modal">
    <div id="modal-msg">씨를 뿌리겠습니까?</div>
    <div class="modal-btn-group">
      <button id="btn-yes" class="modal-btn">예</button>
      <button id="btn-no" class="modal-btn">아니요</button>
    </div>
  </div>

  <div id="game-container"></div>

  <script>
    const config = {
      type: Phaser.AUTO,
      width: window.innerWidth,
      height: window.innerHeight,
      parent: 'game-container',
      physics: { default: 'arcade', arcade: { debug: false } },
      scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let player, cursors, rainEmitter, snowEmitter, dayNightOverlay, seasonOverlay;
    let selectedCrop = 'lettuce';
    let currentHarvestPlot = null;
    const plots = [];

    // 시간 규칙 설정 (밀리초 기준)
    const DAY_DURATION = 180000;    // 하루 = 3분 (180,000ms)
    const SEASON_DURATION = 900000; // 1계절 = 15분 (900,000ms)
    
    // 작물 성장 시간 (2분 = 120,000ms, 1분 = 60,000ms)
    const CROP_DATA = {
      lettuce: { name: '상추 씨', color: 0x2ecc71, time1: 120000, time2: 60000, isUnderground: false },
      corn: { name: '옥수수 씨', color: 0xf1c40f, time1: 120000, time2: 60000, isUnderground: false },
      sweetpotato: { name: '고구마 씨', color: 0x9b59b6, time1: 120000, time2: 60000, isUnderground: true },
      napa: { name: '배추 씨', color: 0x27ae60, time1: 120000, time2: 60000, isUnderground: false }
    };

    const inventory = { lettuce: 0, corn: 0, sweetpotato: 0, napa: 0 };
    const SEASONS = [
      { name: '봄 🌸', color: 0x55efc4, tint: 0x000000, alpha: 0 },
      { name: '여름 ☀️', color: 0x00b894, tint: 0xfffa65, alpha: 0.1 },
      { name: '가을 🍁', color: 0xe17055, tint: 0xd63031, alpha: 0.15 },
      { name: '겨울 ❄️', color: 0x74b9ff, tint: 0xffffff, alpha: 0.25 }
    ];
    let currentSeasonIdx = 0;
    let seasonStartTime = 0;

    function preload() {
      const playerSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="14" fill="#e74c3c"/>
        <circle cx="16" cy="12" r="8" fill="#ffe0bd"/>
        <circle cx="16" cy="16" r="10" fill="#f1c40f" opacity="0.6"/>
      </svg>`;
      const dropSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="4" height="12"><rect width="2" height="10" fill="#a0c4ff"/></svg>`;
      const snowSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8"><circle cx="4" cy="4" r="3" fill="#ffffff"/></svg>`;

      this.textures.addBase64('player', 'data:image/svg+xml;base64,' + btoa(playerSvg));
      this.textures.addBase64('drop', 'data:image/svg+xml;base64,' + btoa(dropSvg));
      this.textures.addBase64('snow', 'data:image/svg+xml;base64,' + btoa(snowSvg));
    }

    function create() {
      const width = this.cameras.main.width;
      const height = this.cameras.main.height;

      // 1. 잔디 배경 & 4x4 밭 생성
      this.add.rectangle(0, 0, 3000, 3000, 0x55efc4).setOrigin(0.5);

      const startX = -120;
      const startY = -120;
      for (let row = 0; row < 4; row++) {
        for (let col = 0; col < 4; col++) {
          const x = startX + col * 80;
          const y = startY + row * 80;

          const tile = this.add.rectangle(x, y, 70, 70, 0x8d5524).setInteractive();
          const cropGraphic = this.add.circle(x, y, 0, 0xffffff);

          const plotData = {
            tile: tile, graphic: cropGraphic,
            state: 'empty', cropType: null, timer1: null, timer2: null
          };

          tile.on('pointerdown', () => handlePlotClick.call(this, plotData));
          plots.push(plotData);
        }
      }

      // 2. 사계절 분위기 오버레이
      seasonOverlay = this.add.rectangle(0, 0, width, height, 0x000000)
        .setOrigin(0, 0).setScrollFactor(0).setAlpha(0);

      // 3. 인게임 3분 하루(밤낮) 오버레이 (1.5분 낮, 1.5분 밤)
      dayNightOverlay = this.add.rectangle(0, 0, width, height, 0x05051a)
        .setOrigin(0, 0).setScrollFactor(0).setAlpha(0);

      this.tweens.add({
        targets: dayNightOverlay,
        alpha: 0.7,
        duration: DAY_DURATION / 2, // 1분 30초 동안 밤으로 전환
        yoyo: true,                 // 1분 30초 동안 낮으로 전환 (총 3분)
        repeat: -1,
        ease: 'Sine.easeInOut'
      });

      player = this.physics.add.sprite(0, 200, 'player');
      this.cameras.main.startFollow(player, true, 0.1, 0.1);
      cursors = this.input.keyboard.createCursorKeys();

      // 4. 날씨 파티클
      rainEmitter = this.add.particles(0, 0, 'drop', {
        x: { min: -600, max: 600 }, y: -400,
        speedY: { min: 400, max: 600 }, lifespan: 1500, quantity: 3
      }).setScrollFactor(0).stop();

      snowEmitter = this.add.particles(0, 0, 'snow', {
        x: { min: -600, max: 600 }, y: -400,
        speedY: { min: 50, max: 120 }, speedX: { min: -30, max: 30 },
        lifespan: 3000, quantity: 2
      }).setScrollFactor(0).stop();

      seasonStartTime = this.time.now;

      // 15분 마다 계절 자동 교체 타이머
      this.time.addEvent({
        delay: SEASON_DURATION,
        callback: changeSeason,
        callbackScope: this,
        loop: true
      });

      fetchSeoulWeather();
      updateInventoryUI();
    }

    function update(time) {
      player.setVelocity(0);
      if (cursors.left.isDown) player.setVelocityX(-160);
      else if (cursors.right.isDown) player.setVelocityX(160);
      if (cursors.up.isDown) player.setVelocityY(-160);
      else if (cursors.down.isDown) player.setVelocityY(160);

      // 계절 타이머 시각 표시
      const elapsed = Math.floor((time - seasonStartTime) / 1000);
      const remainingSec = Math.max(0, (SEASON_DURATION / 1000) - (elapsed % (SEASON_DURATION / 1000)));
      const min = String(Math.floor(remainingSec / 60)).padStart(2, '0');
      const sec = String(Math.floor(remainingSec % 60)).padStart(2, '0');
      
      const currentSeason = SEASONS[currentSeasonIdx];
      document.getElementById('season-text').innerText = `현재 절기: ${currentSeason.name} (다음 계절까지 ${min}:${sec})`;
    }

    // 15분 주기 계절 변경 함수
    function changeSeason() {
      currentSeasonIdx = (currentSeasonIdx + 1) % SEASONS.length;
      const nextSeason = SEASONS[currentSeasonIdx];
      seasonStartTime = this.time.now;

      this.tweens.add({
        targets: seasonOverlay,
        fillColor: nextSeason.tint,
        alpha: nextSeason.alpha,
        duration: 3000
      });
    }

    // 밭 클릭 핸들러
    function handlePlotClick(plot) {
      if (plot.state === 'empty') plantSeed(plot, selectedCrop);
      else if (plot.state === 'seeded') waterCrop(this, plot);
      else if (plot.state === 'fully_grown') harvestCrop(plot);
    }

    function plantSeed(plot, cropType) {
      plot.state = 'seeded';
      plot.cropType = cropType;
      plot.tile.setFillStyle(0x6e3b0f);
      plot.graphic.setRadius(4).setFillStyle(0xdfe6e9);
    }

    function waterCrop(scene, plot) {
      plot.state = 'sprout';
      plot.tile.setFillStyle(0x4e2706);
      plot.graphic.setRadius(8).setFillStyle(0x2ecc71); // 즉시 싹 피움

      const crop = CROP_DATA[plot.cropType];

      // 2분 뒤 작은 열매
      plot.timer1 = scene.time.delayedCall(crop.time1, () => {
        if (plot.state !== 'sprout') return;
        plot.state = 'small_fruit';
        plot.graphic.setRadius(14);
        plot.graphic.setFillStyle(crop.isUnderground ? 0x8e44ad : crop.color);

        // 또 1분 뒤 완전 성장
        plot.timer2 = scene.time.delayedCall(crop.time2, () => {
          if (plot.state !== 'small_fruit') return;
          plot.state = 'fully_grown';
          plot.graphic.setRadius(24).setFillStyle(crop.color);
        });
      });
    }

    function harvestCrop(plot) {
      currentHarvestPlot = plot;
      const cropName = CROP_DATA[plot.cropType].name;
      document.getElementById('modal-msg').innerText = `[${cropName}]를 뿌리겠습니까?`;
      document.getElementById('replant-modal').style.display = 'block';
    }

    document.getElementById('btn-yes').addEventListener('click', () => {
      document.getElementById('replant-modal').style.display = 'none';
      if (currentHarvestPlot) {
        const type = currentHarvestPlot.cropType;
        resetPlot(currentHarvestPlot);
        plantSeed(currentHarvestPlot, type);
      }
    });

    document.getElementById('btn-no').addEventListener('click', () => {
      document.getElementById('replant-modal').style.display = 'none';
      if (currentHarvestPlot) {
        inventory[currentHarvestPlot.cropType]++;
        updateInventoryUI();
        resetPlot(currentHarvestPlot);
      }
    });

    function resetPlot(plot) {
      plot.state = 'empty';
      plot.tile.setFillStyle(0x8d5524);
      plot.graphic.setRadius(0);
      if (plot.timer1) plot.timer1.remove();
      if (plot.timer2) plot.timer2.remove();
    }

    function updateInventoryUI() {
      const listEl = document.getElementById('inv-list');
      listEl.innerHTML = '';
      let hasItem = false;

      Object.keys(inventory).forEach(key => {
        if (inventory[key] > 0) {
          hasItem = true;
          const itemEl = document.createElement('div');
          itemEl.className = 'inv-item';
          itemEl.innerText = `${CROP_DATA[key].name} x ${inventory[key]}`;
          itemEl.onclick = () => {
            selectedCrop = key;
            document.querySelectorAll('.seed-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-crop="${key}"]`).classList.add('active');
          };
          listEl.appendChild(itemEl);
        }
      });
      if (!hasItem) listEl.innerText = '씨앗 없음';
    }

    document.querySelectorAll('.seed-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.seed-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        selectedCrop = e.target.dataset.crop;
      });
    });

    async function fetchSeoulWeather() {
      const infoEl = document.getElementById('weather-text');
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current_weather=true');
        const data = await res.json();
        const code = data.current_weather.weathercode;
        const temp = data.current_weather.temperature;

        let stateText = '맑음 ☀️';
        if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) {
          stateText = '비 🌧️'; rainEmitter.start();
        } else if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) {
          stateText = '눈 ❄️'; snowEmitter.start();
        }
        infoEl.innerText = `서울 실시간 날씨: ${temp}°C / ${stateText}`;
      } catch (err) {
        infoEl.innerText = `서울 날씨: 기본 맑음`;
      }
    }
  </script>
</body>
</html>
