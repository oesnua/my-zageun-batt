<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>사계절 힐링 텃밭</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    * { touch-action: none; user-select: none; -webkit-user-select: none; }
    body { margin: 0; padding: 0; overflow: hidden; background-color: #1b262c; font-family: 'Malgun Gothic', sans-serif; }
    #game-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    
    /* UI 레이아웃 */
    #ui-panel {
      position: absolute; top: 12px; left: 12px; z-index: 10; color: #fff;
      background: rgba(0, 0, 0, 0.65); padding: 10px 16px; border-radius: 14px;
      backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.15); font-size: 12px; pointer-events: none;
    }
    #season-text { font-size: 14px; font-weight: bold; color: #2ecc71; margin-bottom: 2px; }
    #weather-text { color: #74b9ff; }

    #inventory-panel {
      position: absolute; top: 12px; right: 12px; z-index: 10; color: #fff;
      background: rgba(0, 0, 0, 0.65); padding: 10px 14px; border-radius: 12px;
      backdrop-filter: blur(8px); font-size: 12px; min-width: 120px;
    }
    #inventory-panel h4 { margin: 0 0 6px 0; font-size: 13px; color: #f1c40f; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 4px; }
    .inv-item { margin-bottom: 4px; cursor: pointer; }

    #seed-selector {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
      display: flex; gap: 6px; background: rgba(0, 0, 0, 0.7); padding: 8px 12px;
      border-radius: 30px; backdrop-filter: blur(8px);
    }
    .seed-btn {
      padding: 8px 12px; font-size: 12px; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px; background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; transition: 0.2s;
    }
    .seed-btn.active { background: #2ecc71; border-color: #2ecc71; font-weight: bold; }

    /* 팝업 모달 */
    #replant-modal {
      display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 100; background: rgba(20, 20, 20, 0.95); color: #fff; padding: 20px 28px;
      border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8); min-width: 240px;
    }
    #modal-msg { font-size: 15px; margin-bottom: 16px; font-weight: bold; }
    .modal-btn-group { display: flex; justify-content: center; gap: 12px; }
    .modal-btn { padding: 8px 20px; font-size: 13px; border: none; border-radius: 18px; cursor: pointer; font-weight: bold; }
    #btn-yes { background: #2ecc71; color: #fff; }
    #btn-no { background: #e74c3c; color: #fff; }
  </style>
</head>
<body>
  <div id="ui-panel">
    <div id="season-text">🌸 현재 절기: 봄 (00:00)</div>
    <div id="weather-text">서울 실시간 날씨 로딩 중...</div>
    <div style="margin-top: 4px; opacity: 0.8;">💡 <b>조작:</b> 화면 터치/클릭 이동 | 밭 터치(재배)</div>
  </div>

  <div id="inventory-panel">
    <h4>🎒 보관함 (씨앗)</h4>
    <div id="inv-list">씨앗 없음</div>
  </div>

  <div id="seed-selector">
    <button class="seed-btn active" data-crop="lettuce">🥬 봄: 상추</button>
    <button class="seed-btn" data-crop="corn">🌽 여름: 옥수수</button>
    <button class="seed-btn" data-crop="sweetpotato">🍠 가을: 고구마</button>
    <button class="seed-btn" data-crop="napa">🥬 겨울: 배추</button>
  </div>

  <div id="replant-modal">
    <div id="modal-msg">씨를 뿌리겠습니까?</div>
    <div class="modal-btn-group">
      <button id="btn-yes" class="modal-btn">예</button>
      <button id="btn-no" class="modal-btn">아니요</button>
    </div>
  </div>

  <div id="game-container"></div>

  <script>
    const config = {
      type: Phaser.AUTO,
      width: window.innerWidth,
      height: window.innerHeight,
      parent: 'game-container',
      scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH },
      physics: { default: 'arcade', arcade: { debug: false } },
      scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let player, targetPoint, rainEmitter, snowEmitter, dayNightOverlay, seasonOverlay;
    let selectedCrop = 'lettuce';
    let currentHarvestPlot = null;
    let isMovingToTarget = false;
    const plots = [];

    const DAY_DURATION = 180000;    // 3분
    const SEASON_DURATION = 900000; // 15분

    const CROP_DATA = {
      lettuce: { name: '상추 씨', color: 0x2ecc71, time1: 120000, time2: 60000, isUnderground: false },
      corn: { name: '옥수수 씨', color: 0xf1c40f, time1: 120000, time2: 60000, isUnderground: false },
      sweetpotato: { name: '고구마 씨', color: 0x9b59b6, time1: 120000, time2: 60000, isUnderground: true },
      napa: { name: '배추 씨', color: 0x27ae60, time1: 120000, time2: 60000, isUnderground: false }
    };

    const inventory = { lettuce: 0, corn: 0, sweetpotato: 0, napa: 0 };
    const SEASONS = [
      { name: '봄 🌸', tint: 0x000000, alpha: 0 },
      { name: '여름 ☀️', tint: 0xfffa65, alpha: 0.08 },
      { name: '가을 🍁', tint: 0xd63031, alpha: 0.12 },
      { name: '겨울 ❄️', tint: 0xffffff, alpha: 0.2 }
    ];
    let currentSeasonIdx = 0;
    let seasonStartTime = 0;

    function preload() {
      // 1. 밀짚모자를 쓴 탑뷰 캐릭터 SVG
      const playerSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="28" fill="#e74c3c"/>
        <circle cx="32" cy="24" r="16" fill="#ffe0bd"/>
        <circle cx="32" cy="32" r="22" fill="#f1c40f"/>
        <circle cx="32" cy="32" r="8" fill="#d35400"/>
      </svg>`;

      // 2. 부드럽고 둥근 입체 흙 밭 타일 SVG (더 이상 네모나지 않음)
      const dirtSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
        <rect width="100" height="100" fill="#795548" rx="20"/>
        <rect x="6" y="6" width="88" height="88" fill="#5d4037" rx="16"/>
        <circle cx="30" cy="30" r="5" fill="#3e2723" opacity="0.6"/>
        <circle cx="70" cy="65" r="6" fill="#3e2723" opacity="0.6"/>
        <circle cx="45" cy="75" r="4" fill="#3e2723" opacity="0.6"/>
      </svg>`;

      const dropSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="4" height="12"><rect width="4" height="12" rx="2" fill="#74b9ff"/></svg>`;
      const snowSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><circle cx="5" cy="5" r="4" fill="#ffffff"/></svg>`;

      this.textures.addBase64('player', 'data:image/svg+xml;base64,' + btoa(playerSvg));
      this.textures.addBase64('dirt', 'data:image/svg+xml;base64,' + btoa(dirtSvg));
      this.textures.addBase64('drop', 'data:image/svg+xml;base64,' + btoa(dropSvg));
      this.textures.addBase64('snow', 'data:image/svg+xml;base64,' + btoa(snowSvg));
    }

    function create() {
      const scene = this;

      // 배경 격자 패턴
      this.add.grid(0, 0, 3000, 3000, 64, 64, 0x55efc4, 1, 0x48dbfb, 0.2);

      // 4x4 텃밭 타일 생성
      const startX = -180;
      const startY = -180;
      for (let row = 0; row < 4; row++) {
        for (let col = 0; col < 4; col++) {
          const x = startX + col * 120;
          const y = startY + row * 120;

          // 둥근 밭 이미지 타일 적용
          const tile = this.add.image(x, y, 'dirt').setInteractive().setScale(1);
          const cropGraphic = this.add.circle(x, y, 0, 0xffffff);

          const plotData = {
            tile: tile, graphic: cropGraphic,
            state: 'empty', cropType: null, timer1: null, timer2: null, x: x, y: y
          };

          tile.on('pointerdown', () => {
            moveTo(x, y);
            handlePlotClick.call(scene, plotData);
          });

          plots.push(plotData);
        }
      }

      // 화면 어디든 터치/클릭하면 해당 위치로 캐릭터 부드럽게 이동
      this.input.on('pointerdown', (pointer) => {
        const worldPoint = scene.cameras.main.getWorldPoint(pointer.x, pointer.y);
        moveTo(worldPoint.x, worldPoint.y);
      });

      // 분위기 오버레이
      seasonOverlay = this.add.rectangle(0, 0, 4000, 4000, 0x000000).setScrollFactor(0).setAlpha(0);
      dayNightOverlay = this.add.rectangle(0, 0, 4000, 4000, 0x05051a).setScrollFactor(0).setAlpha(0);

      this.tweens.add({
        targets: dayNightOverlay,
        alpha: 0.65,
        duration: DAY_DURATION / 2,
        yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
      });

      // 플레이어 캐릭터 생성
      player = this.physics.add.sprite(0, 300, 'player').setScale(0.85);
      targetPoint = new Phaser.Math.Vector2(0, 300);

      this.cameras.main.startFollow(player, true, 0.1, 0.1);

      // 날씨 효과
      rainEmitter = this.add.particles(0, 0, 'drop', {
        x: { min: -1000, max: 1000 }, y: -600,
        speedY: { min: 500, max: 800 }, lifespan: 1200, quantity: 4
      }).setScrollFactor(0).stop();

      snowEmitter = this.add.particles(0, 0, 'snow', {
        x: { min: -1000, max: 1000 }, y: -600,
        speedY: { min: 60, max: 140 }, speedX: { min: -40, max: 40 },
        lifespan: 2500, quantity: 3
      }).setScrollFactor(0).stop();

      seasonStartTime = this.time.now;
      this.time.addEvent({ delay: SEASON_DURATION, callback: changeSeason, callbackScope: this, loop: true });

      fetchSeoulWeather();
      updateInventoryUI();
    }

    function moveTo(x, y) {
      targetPoint.x = x;
      targetPoint.y = y;
      isMovingToTarget = true;
    }

    function update(time) {
      // 터치한 곳으로 부드럽게 걸어가기
      if (isMovingToTarget) {
        const distance = Phaser.Math.Distance.Between(player.x, player.y, targetPoint.x, targetPoint.y);
        if (distance < 10) {
          player.body.reset(targetPoint.x, targetPoint.y);
          isMovingToTarget = false;
        } else {
          this.physics.moveToObject(player, targetPoint, 220);
        }
      }

      // 계절 시계 업데이트
      const elapsed = Math.floor((time - seasonStartTime) / 1000);
      const remainingSec = Math.max(0, (SEASON_DURATION / 1000) - (elapsed % (SEASON_DURATION / 1000)));
      const min = String(Math.floor(remainingSec / 60)).padStart(2, '0');
      const sec = String(Math.floor(remainingSec % 60)).padStart(2, '0');
      
      const currentSeason = SEASONS[currentSeasonIdx];
      document.getElementById('season-text').innerText = `현재 절기: ${currentSeason.name} (다음 계절까지 ${min}:${sec})`;
    }

    function changeSeason() {
      currentSeasonIdx = (currentSeasonIdx + 1) % SEASONS.length;
      const nextSeason = SEASONS[currentSeasonIdx];
      seasonStartTime = this.time.now;

      this.tweens.add({
        targets: seasonOverlay,
        fillColor: nextSeason.tint,
        alpha: nextSeason.alpha,
        duration: 3000
      });
    }

    function handlePlotClick(plot) {
      if (plot.state === 'empty') plantSeed(plot, selectedCrop);
      else if (plot.state === 'seeded') waterCrop(this, plot);
      else if (plot.state === 'fully_grown') harvestCrop(plot);
    }

    function plantSeed(plot, cropType) {
      plot.state = 'seeded';
      plot.cropType = cropType;
      plot.tile.setTint(0xa1887f);
      plot.graphic.setRadius(6).setFillStyle(0xdfe6e9);
    }

    function waterCrop(scene, plot) {
      plot.state = 'sprout';
      plot.tile.setTint(0x4e342e); // 물을 머금은 짙은 흙
      plot.graphic.setRadius(12).setFillStyle(0x2ecc71);

      const crop = CROP_DATA[plot.cropType];

      plot.timer1 = scene.time.delayedCall(crop.time1, () => {
        if (plot.state !== 'sprout') return;
        plot.state = 'small_fruit';
        plot.graphic.setRadius(20);
        plot.graphic.setFillStyle(crop.isUnderground ? 0x8e44ad : crop.color);

        plot.timer2 = scene.time.delayedCall(crop.time2, () => {
          if (plot.state !== 'small_fruit') return;
          plot.state = 'fully_grown';
          plot.graphic.setRadius(32).setFillStyle(crop.color);
        });
      });
    }

    function harvestCrop(plot) {
      currentHarvestPlot = plot;
      const cropName = CROP_DATA[plot.cropType].name;
      document.getElementById('modal-msg').innerText = `[${cropName}]를 뿌리겠습니까?`;
      document.getElementById('replant-modal').style.display = 'block';
    }

    document.getElementById('btn-yes').addEventListener('click', () => {
      document.getElementById('replant-modal').style.display = 'none';
      if (currentHarvestPlot) {
        const type = currentHarvestPlot.cropType;
        resetPlot(currentHarvestPlot);
        plantSeed(currentHarvestPlot, type);
      }
    });

    document.getElementById('btn-no').addEventListener('click', () => {
      document.getElementById('replant-modal').style.display = 'none';
      if (currentHarvestPlot) {
        inventory[currentHarvestPlot.cropType]++;
        updateInventoryUI();
        resetPlot(currentHarvestPlot);
      }
    });

    function resetPlot(plot) {
      plot.state = 'empty';
      plot.tile.clearTint();
      plot.graphic.setRadius(0);
      if (plot.timer1) plot.timer1.remove();
      if (plot.timer2) plot.timer2.remove();
    }

    function updateInventoryUI() {
      const listEl = document.getElementById('inv-list');
      listEl.innerHTML = '';
      let hasItem = false;

      Object.keys(inventory).forEach(key => {
        if (inventory[key] > 0) {
          hasItem = true;
          const itemEl = document.createElement('div');
          itemEl.className = 'inv-item';
          itemEl.innerText = `${CROP_DATA[key].name} x ${inventory[key]}`;
          itemEl.onclick = () => {
            selectedCrop = key;
            document.querySelectorAll('.seed-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-crop="${key}"]`).classList.add('active');
          };
          listEl.appendChild(itemEl);
        }
      });
      if (!hasItem) listEl.innerText = '씨앗 없음';
    }

    document.querySelectorAll('.seed-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.seed-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        selectedCrop = e.target.dataset.crop;
      });
    });

    async function fetchSeoulWeather() {
      const infoEl = document.getElementById('weather-text');
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current_weather=true');
        const data = await res.json();
        const code = data.current_weather.weathercode;
        const temp = data.current_weather.temperature;

        let stateText = '맑음 ☀️';
        if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) {
          stateText = '비 🌧️'; rainEmitter.start();
        } else if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) {
          stateText = '눈 ❄️'; snowEmitter.start();
        }
        infoEl.innerText = `서울 실시간 날씨: ${temp}°C / ${stateText}`;
      } catch (err) {
        infoEl.innerText = `서울 날씨: 기본 맑음`;
      }
    }
  </script>
</body>
</html>
